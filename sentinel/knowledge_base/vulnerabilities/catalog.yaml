# ==============================================================================
# SUMMARY STATISTICS
# ==============================================================================
# ==============================================================================
# EXTERNAL VULNERABILITY REFERENCES
# Sources: kadenzipfel/smart-contract-vulnerabilities,
#          ImmuneBytes/Blockchain-Attack-Vectors,
#          shafu0x/awesome-smart-contracts
# ==============================================================================

external_references:

  # ---------------------------------------------------------------------------
  # kadenzipfel/smart-contract-vulnerabilities
  # Detailed individual vulnerability writeups with prevention
  # Source: https://github.com/kadenzipfel/smart-contract-vulnerabilities
  # ---------------------------------------------------------------------------
  smart_contract_vulnerabilities:
    repository: "https://github.com/kadenzipfel/smart-contract-vulnerabilities"

    access_control:
      - id: "SCV-AC-01"
        name: "Authorization Through tx.origin"
        file: "vulnerabilities/authorization-txorigin.md"
        severity: "critical"
        description: "tx.origin returns original sender, not immediate caller - phishing via malicious contracts"
        detection: "tx.origin used in require/if for authorization"

      - id: "SCV-AC-02"
        name: "Insufficient Access Control"
        file: "vulnerabilities/insufficient-access-control.md"
        severity: "critical"
        description: "Missing or incorrect access modifiers on sensitive functions"
        detection: "Public/external functions without onlyOwner/onlyRole"

      - id: "SCV-AC-03"
        name: "Delegatecall to Untrusted Callee"
        file: "vulnerabilities/delegatecall-untrusted-callee.md"
        severity: "critical"
        description: "Delegatecall to user-controlled address executes attacker code in victim context"
        detection: "delegatecall with user-supplied address parameter"

      - id: "SCV-AC-04"
        name: "Signature Malleability"
        file: "vulnerabilities/signature-malleability.md"
        severity: "high"
        description: "ECDSA signatures can be modified to create valid alternate signatures"
        detection: "ecrecover without s-value range check"

      - id: "SCV-AC-05"
        name: "Missing Signature Replay Protection"
        file: "vulnerabilities/missing-protection-signature-replay.md"
        severity: "high"
        description: "Signed messages can be replayed on same or different chains"
        detection: "Missing nonce or chainId in signed data"

    math:
      - id: "SCV-MATH-01"
        name: "Integer Overflow and Underflow"
        file: "vulnerabilities/overflow-underflow.md"
        severity: "high"
        description: "Arithmetic exceeds type bounds (pre-0.8.0 or unchecked blocks)"
        detection: "unchecked blocks with arithmetic, Solidity < 0.8.0"

      - id: "SCV-MATH-02"
        name: "Off-By-One"
        file: "vulnerabilities/off-by-one.md"
        severity: "medium"
        description: "Boundary errors in loops, arrays, or comparisons (< vs <=)"
        detection: "Loop bounds, array indexing, >= vs > in comparisons"

      - id: "SCV-MATH-03"
        name: "Lack of Precision"
        file: "vulnerabilities/lack-of-precision.md"
        severity: "high"
        description: "Division before multiplication or insufficient decimal handling"
        detection: "Division followed by multiplication, small denominators"

    control_flow:
      - id: "SCV-CF-01"
        name: "Reentrancy"
        file: "vulnerabilities/reentrancy.md"
        severity: "critical"
        description: "External call before state update allows recursive exploitation"
        detection: "call/transfer/send before state changes"

      - id: "SCV-CF-02"
        name: "DoS with Block Gas Limit"
        file: "vulnerabilities/dos-gas-limit.md"
        severity: "medium"
        description: "Unbounded loops or arrays exceed block gas limit"
        detection: "Loops over user-growable arrays"

      - id: "SCV-CF-03"
        name: "DoS with Unexpected Revert"
        file: "vulnerabilities/dos-revert.md"
        severity: "medium"
        description: "External call failure reverts entire transaction"
        detection: "Pull-over-push violations, missing try/catch"

      - id: "SCV-CF-04"
        name: "Using msg.value in a Loop"
        file: "vulnerabilities/msgvalue-loop.md"
        severity: "critical"
        description: "msg.value re-used in loop iterations, spending same ETH multiple times"
        detection: "msg.value inside for/while loop"

      - id: "SCV-CF-05"
        name: "Transaction-Ordering Dependence (Front-running)"
        file: "vulnerabilities/transaction-ordering-dependence.md"
        severity: "medium"
        description: "Transaction outcome depends on execution order, exploitable by miners/MEV"
        detection: "State-dependent transactions without commit-reveal or slippage protection"

      - id: "SCV-CF-06"
        name: "Insufficient Gas Griefing"
        file: "vulnerabilities/insufficient-gas-griefing.md"
        severity: "medium"
        description: "Relayer forwards transaction with insufficient gas for subcall"
        detection: "External calls in relayed transactions without gas checks"

    data_handling:
      - id: "SCV-DH-01"
        name: "Unchecked Return Value"
        file: "vulnerabilities/unchecked-return-values.md"
        severity: "high"
        description: "Failed low-level calls silently succeed if return not checked"
        detection: "call/send without checking bool return"

      - id: "SCV-DH-02"
        name: "Write to Arbitrary Storage Location"
        file: "vulnerabilities/arbitrary-storage-location.md"
        severity: "critical"
        description: "User-controlled index writes to arbitrary storage slots"
        detection: "Array access with user-controlled index without bounds check"

      - id: "SCV-DH-03"
        name: "Unbounded Return Data"
        file: "vulnerabilities/unbounded-return-data.md"
        severity: "medium"
        description: "External call returns large data, consuming gas via memory expansion"
        detection: "Low-level calls without return data size limits"

      - id: "SCV-DH-04"
        name: "Unexpected ecrecover Null Address"
        file: "vulnerabilities/unexpected-ecrecover-null-address.md"
        severity: "high"
        description: "ecrecover returns address(0) for invalid signatures"
        detection: "ecrecover without zero-address check on result"

    unsafe_logic:
      - id: "SCV-UL-01"
        name: "Weak Randomness from Chain Attributes"
        file: "vulnerabilities/weak-sources-randomness.md"
        severity: "high"
        description: "block.timestamp, blockhash etc. are manipulable by miners"
        detection: "Random generation using block.timestamp, block.difficulty, blockhash"

      - id: "SCV-UL-02"
        name: "Hash Collision with abi.encodePacked"
        file: "vulnerabilities/hash-collision.md"
        severity: "medium"
        description: "Multiple variable-length args in encodePacked create collision risk"
        detection: "abi.encodePacked with 2+ dynamic types"

      - id: "SCV-UL-03"
        name: "Timestamp Dependence"
        file: "vulnerabilities/timestamp-dependence.md"
        severity: "low"
        description: "block.timestamp can be slightly manipulated by miners"
        detection: "Critical logic depending on exact timestamps"

      - id: "SCV-UL-04"
        name: "Asserting Contract from Code Size"
        file: "vulnerabilities/asserting-contract-from-code-size.md"
        severity: "medium"
        description: "Constructor has 0 code size, bypasses isContract checks"
        detection: "extcodesize checks for EOA validation"

