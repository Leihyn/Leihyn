[project]
name = "caseworker-agent"
version = "0.1.0"
description = "Evidence-first autonomous case execution for multi-party consumer disputes"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "google-adk[gcp]>=2.0.0,<3.0.0",
  "google-cloud-firestore>=2.21,<3",
  "google-cloud-pubsub>=2.31,<3",
  "google-cloud-storage>=3.3,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

